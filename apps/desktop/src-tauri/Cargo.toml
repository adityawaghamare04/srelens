[package]
name = "srelens-desktop"
version = "0.1.0"
description = "Srelens Kubernetes desktop workspace"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "srelens_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
srelens-capability = { path = "../../../crates/capability" }
srelens-mcp = { path = "../../../crates/mcp" }
srelens-kube = { path = "../../../crates/kube" }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
